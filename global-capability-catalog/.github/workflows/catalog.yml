name: Capability Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "schemas/**"
      - "prompts/**"
      - "skills/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/catalog.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "schemas/**"
      - "prompts/**"
      - "skills/**"
      - "package.json"
      - "package-lock.json"

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run catalog:subset -- --root "$GITHUB_WORKSPACE" --dry-run
