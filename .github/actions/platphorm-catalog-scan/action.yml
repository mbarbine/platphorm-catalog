name: 'PlatPhorm Catalog Scanner'
description: 'Collect repository-local catalog evidence and publish it to catalog.platphormnews.com.'
author: 'PlatPhorm News'
runs:
  using: 'node20'
  main: 'scan-repo.js'
inputs:
  catalog_api_url:
    description: 'Catalog API base URL.'
    required: false
    default: 'https://catalog.platphormnews.com'
  api_key:
    description: 'API key for protected catalog publication endpoint.'
    required: false
  publish:
    description: 'Whether to publish the scan result.'
    required: false
    default: 'true'
  max_files:
    description: 'Maximum source files to inspect for local evidence.'
    required: false
    default: '2400'
  artifact_path:
    description: 'Destination path for the generated publication artifact.'
    required: false
    default: '.platphorm/catalog.json'
  scanner_version:
    description: 'Scanner version string recorded in publication metadata.'
    required: false
    default: '1.0.0'
  owner:
    description: 'Optional repository owner override for local/manual runs.'
    required: false
    default: ''
  repository:
    description: 'Optional repository name override for local/manual runs.'
    required: false
    default: ''
outputs:
  publication_file:
    description: 'Path to the generated publication JSON artifact.'
  request_id:
    description: 'Request identifier returned by the catalog API, when publication is enabled.'
  publication_status:
    description: 'Publication API response status: success|fallback|not_published.'
  warnings:
    description: 'Number of warnings generated by the scanner.'
runs:
  using: node20
  main: 'scan-repo.js'
